<title>Dunkelmond</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* Layout: full-bleed 3D stage; HUD pinned to the corners; storybook dialog rises from the bottom like a spell scroll */
:root{
  color-scheme: dark;
  --night:#07051a;
  --ink:rgba(11,7,32,.84);
  --line:rgba(176,156,255,.30);
  --violet:#a08cff;
  --moon:#eee9ff;
  --dim:#b0a6dc;
  --ember:#ffb45e;
  --display:"Cinzel Decorative","Cinzel",Georgia,serif;
  --label:"Cinzel",Georgia,serif;
  --body:"IM Fell English",Georgia,"Times New Roman",serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--moon);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated;filter:saturate(1.18) contrast(1.06)}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 42%,rgba(5,2,18,.5) 78%,rgba(2,1,10,.92) 100%)}
.grain{position:fixed;inset:-50%;pointer-events:none;opacity:.07;mix-blend-mode:overlay;animation:grain .9s steps(5) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
.hud-top{position:absolute;left:16px;top:calc(14px + var(--safe-t));display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 170px)}
.shards{display:flex;gap:9px;align-items:center}
.shards i{width:14px;height:14px;transform:rotate(45deg) scaleY(1.25);border:1.5px solid rgba(190,175,255,.55);background:rgba(20,12,50,.6);transition:all .5s}
.shards i.got{background:var(--moon);border-color:#fff;box-shadow:0 0 10px 3px rgba(170,140,255,.85),0 0 22px 6px rgba(120,90,255,.45)}
.goal{font-family:var(--label);font-size:13px;letter-spacing:.06em;color:var(--dim);text-shadow:0 1px 6px #000;line-height:1.35}
.hud-right{position:absolute;right:16px;top:calc(12px + var(--safe-t));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#map{width:118px;height:118px;border-radius:50%;border:1px solid var(--line);box-shadow:0 0 18px rgba(80,50,200,.35),inset 0 0 20px #000;background:rgba(8,5,26,.55)}
.iconbtn{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--ink);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:var(--moon);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.zone{position:fixed;left:0;right:0;top:28%;text-align:center;pointer-events:none;font-family:var(--display);font-size:clamp(28px,6vw,54px);letter-spacing:.06em;color:var(--moon);text-shadow:0 0 24px rgba(140,110,255,.9),0 2px 3px #000;opacity:0;transition:opacity 1.2s}
.zone small{display:block;font-family:var(--label);font-size:12px;letter-spacing:.4em;color:var(--dim);margin-bottom:6px;text-shadow:0 1px 4px #000}
.zone.on{opacity:1}
.toast{position:fixed;left:50%;bottom:calc(150px + var(--safe-b));transform:translateX(-50%);width:min(520px,calc(100% - 32px));text-align:center;font-size:18px;line-height:1.4;color:var(--moon);text-shadow:0 1px 6px #000,0 0 14px rgba(0,0,0,.8);pointer-events:none;opacity:0;transition:opacity .5s}
.toast.on{opacity:1}
.prompt{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%);pointer-events:auto;cursor:pointer;padding:10px 20px;border-radius:30px;border:1px solid var(--line);background:var(--ink);font-family:var(--label);font-size:14px;letter-spacing:.08em;box-shadow:0 0 18px rgba(120,90,255,.35)}
.prompt kbd{font-family:var(--label);display:inline-block;min-width:22px;padding:1px 6px;margin-right:8px;border-radius:5px;border:1px solid var(--violet);color:var(--violet)}

/* Dialog */
.dialog{position:fixed;left:50%;bottom:calc(18px + var(--safe-b));transform:translateX(-50%);width:min(640px,calc(100% - 32px));box-sizing:border-box;padding:16px 20px 18px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(26,16,64,.92),rgba(9,6,28,.94));box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 30px rgba(110,80,255,.25);pointer-events:auto;cursor:pointer}
.dialog .who{font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--ember);margin-bottom:6px}
.dialog p{margin:0;font-size:19px;line-height:1.45;min-height:2.9em}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.choices button{cursor:pointer;padding:9px 16px;border-radius:24px;border:1px solid var(--violet);background:rgba(60,40,140,.35);font-size:17px}
.choices button:hover{background:rgba(110,80,230,.5)}
.dnext{position:absolute;right:16px;bottom:10px;color:var(--violet);font-size:14px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}

/* Touch */
#touch{position:fixed;inset:0;pointer-events:none}
#joyzone{position:absolute;left:0;bottom:0;width:45%;height:55%;pointer-events:auto}
#joy{position:absolute;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;border:1px solid var(--line);background:rgba(14,9,40,.45);opacity:.55;left:90px;top:calc(100% - 110px - var(--safe-b))}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(170,150,255,.5);box-shadow:0 0 14px rgba(150,120,255,.6)}
#bJump{position:absolute;right:22px;bottom:calc(30px + var(--safe-b));width:80px;height:80px;border-radius:50%;border:1px solid var(--line);background:rgba(20,12,56,.6);pointer-events:auto;font-family:var(--label);font-size:12px;letter-spacing:.1em}

/* Screens */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;box-sizing:border-box;text-align:center;background:radial-gradient(ellipse at 50% 60%,rgba(8,4,26,.1),rgba(5,3,18,.75) 80%)}
.screen h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(46px,12vw,104px);line-height:1;letter-spacing:.03em;color:var(--moon);text-shadow:0 0 30px rgba(150,120,255,.95),0 0 80px rgba(100,60,255,.6),0 3px 2px #000;text-wrap:balance}
.eyebrow{font-family:var(--label);font-size:12px;letter-spacing:.5em;color:var(--dim);text-transform:uppercase}
.lede{max-width:34ch;font-size:20px;line-height:1.5;color:var(--moon);text-shadow:0 1px 8px #000;margin:0}
.start{pointer-events:auto;cursor:pointer;margin-top:8px;padding:14px 34px;border-radius:40px;border:1px solid rgba(220,205,255,.7);background:linear-gradient(180deg,rgba(120,90,255,.55),rgba(60,30,170,.55));font-family:var(--label);font-weight:700;font-size:17px;letter-spacing:.14em;box-shadow:0 0 30px rgba(130,100,255,.55);transition:transform .2s,box-shadow .2s}
.start:hover{transform:translateY(-2px);box-shadow:0 0 44px rgba(150,120,255,.8)}
.controls{font-family:var(--label);font-size:12px;letter-spacing:.08em;color:var(--dim);line-height:1.9;max-width:42ch}
.stat{font-family:var(--label);font-size:15px;letter-spacing:.12em;color:var(--dim);font-variant-numeric:tabular-nums}
#warp{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .8s}
#fade{position:fixed;inset:0;background:#05031a;pointer-events:none;opacity:0;transition:opacity 1s}
@media (max-width:520px){
  .goal{font-size:11.5px}
  #map{width:92px;height:92px}
  .dialog p{font-size:17px}
  .toast{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.grain,.dnext{animation:none}}
</style>

<div id="stage"></div>
<div class="vignette"></div>
<div class="grain" id="grain"></div>

<div id="hud" hidden>
  <div class="hud-top">
    <div class="shards" id="shards" aria-label="Mondsplitter"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="goal" id="goal"></div>
  </div>
  <div class="hud-right">
    <canvas id="map" width="236" height="236" aria-label="Karte"></canvas>
    <button class="iconbtn" id="mute" aria-label="Ton ausschalten" title="Ton (M)"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
  </div>
</div>
<div class="zone" id="zone"></div>
<div class="toast" id="toast"></div>
<button class="prompt" id="prompt" hidden></button>
<div class="dialog" id="dialog" hidden>
  <div class="who" id="dwho"></div>
  <p id="dtext"></p>
  <div class="choices" id="dchoices"></div>
  <div class="dnext" id="dnext">&#9662;</div>
</div>
<div id="touch" hidden>
  <div id="joyzone"><div id="joy"><div id="knob"></div></div></div>
  <button id="bJump">SPRUNG</button>
</div>

<div class="screen" id="title">
  <div class="eyebrow">Ein Märchen der Nacht</div>
  <h1>Dunkelmond</h1>
  <p class="lede" id="lede">Der Mond ist zerbrochen. Fünf Splitter liegen verstreut in den Wäldern, und nur ein kleiner Zwerg kann sie zurückbringen.</p>
  <button class="start" id="startBtn">Spiel starten</button>
  <div class="controls" id="controls"></div>
</div>
<div class="screen" id="end" hidden>
  <div class="eyebrow">Ende</div>
  <h1>Der Mond<br>ist wieder ganz</h1>
  <div class="stat" id="endStat"></div>
  <button class="start" id="againBtn">Nochmal spielen</button>
</div>
<canvas id="warp"></canvas>
<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window);
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
$('controls').innerHTML = TOUCH
  ? 'Linker Daumen: laufen &nbsp;·&nbsp; Rechts wischen: umsehen<br>Sprung-Knopf: springen &nbsp;·&nbsp; Hinweise antippen: sprechen'
  : 'WASD laufen &nbsp;·&nbsp; Shift rennen &nbsp;·&nbsp; Leertaste springen<br>Maus ziehen: umsehen &nbsp;·&nbsp; Mausrad: Zoom &nbsp;·&nbsp; E: sprechen';
if (!window.THREE) {
  $('lede').textContent = 'Die 3D-Grafik konnte nicht geladen werden. Prüfe deine Internetverbindung und lade die Seite neu.';

}
const V3 = THREE.Vector3;

/* ---------- film grain ---------- */
(() => {
  const c = document.createElement('canvas'); c.width = c.height = 160;
  const x = c.getContext('2d'), d = x.createImageData(160, 160);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i+1] = d.data[i+2] = v; d.data[i+3] = 255; }
  x.putImageData(d, 0, 0);
  $('grain').style.backgroundImage = `url(${c.toDataURL()})`;
})();

/* ---------- math + noise ---------- */
function hash2(x, y) {

  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o = 4) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= 0.5; } return s / (1 - Math.pow(0.5, o)); }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let seed = 20261009;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rr = (a, b) => a + rnd() * (b - a);

/* ---------- world layout ---------- */
const WORLD_C = { x: 0, z: -40 }, WORLD_R = 95;
const WATER_Y = -0.8;
const LAKE = { x: 58, z: -54, r: 17 };
const ZP = {
  hub: { x: 0, z: 0 }, pilz: { x: -55, z: 18 }, kroete: { x: -35, z: -30 },
  auge: { x: -48, z: -80 }, drache: { x: 42, z: -39 }, schaedel: { x: 50, z: 20 }, turm: { x: 0, z: -102 }
};
const PATHS = [
  [[0, 3], [-20, 10], [-40, 19], [-50, 18]],
  [[0, 0], [-15, -15], [-31, -27]],
  [[-35, -30], [-42, -48], [-46, -60]],
  [[0, -3], [2, -30], [-3, -55], [0, -83]],
  [[0, 0], [20, -22], [40, -37]],
  [[0, 2], [25, 9], [44, 17]],
];
const SEGS = [];
PATHS.forEach(p => { for (let i = 0; i < p.length - 1; i++) SEGS.push([p[i][0], p[i][1], p[i + 1][0], p[i + 1][1]]); });
function pathDist(x, z) {
  let m = 1e9;
  for (const s of SEGS) {
    const dx = s[2] - s[0], dz = s[3] - s[1];
    const t = clamp(((x - s[0]) * dx + (z - s[1]) * dz) / (dx * dx + dz * dz), 0, 1);
    const ex = s[0] + dx * t - x, ez = s[1] + dz * t - z;
    const d = ex * ex + ez * ez; if (d < m) m = d;
  }
  return Math.sqrt(m);
}
const baseH = (x, z) => (fbm(x * 0.035 + 3.1, z * 0.035 + 7.7) - 0.5) * 9;
const FLATS = [
  { x: 0, z: 0, r: 11 }, { x: -55, z: 18, r: 15 }, { x: -35, z: -30, r: 10 }, { x: -48, z: -72, r: 17 },
  { x: 42, z: -39, r: 6 }, { x: 50, z: 20, r: 13 }, { x: 0, z: -96, r: 16 }
];
FLATS.forEach(f => f.h = baseH(f.x, f.z) * 0.35);
function terrainH(x, z) {
  let h = baseH(x, z);
  const pd = pathDist(x, z);
  h = lerp(h, h * 0.3, 1 - smooth(2, 7, pd));
  for (const f of FLATS) {
    const d = Math.hypot(x - f.x, z - f.z);
    if (d < f.r + 9) h = lerp(h, f.h, 1 - smooth(f.r, f.r + 9, d));
  }
  const dl = Math.hypot(x - LAKE.x, z - LAKE.z);
  if (dl < LAKE.r + 4) {
    const lakeH = lerp(-4, 0.4, 1 - smooth(2.6, 4.6, dl));
    h = lerp(h, lakeH, 1 - smooth(LAKE.r - 3, LAKE.r + 3, dl));
  }
  const dc = Math.hypot(x - WORLD_C.x, z - WORLD_C.z);
  const m = smooth(90, 128, dc);
  if (m > 0) h += m * m * 58 * (0.5 + 0.9 * fbm(x * 0.045 + 20, z * 0.045));
  return h;
}

/* ---------- renderer / scene ---------- */
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
let quality = 0.72;
const setPR = () => renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6) * quality);
setPR();
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const FOG_COL = new THREE.Color(0x261a58);
scene.background = FOG_COL.clone();
scene.fog = new THREE.FogExp2(FOG_COL, 0.0115);
const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 700);
function resize() {
  const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.fov = w < h ? 74 : 60; camera.updateProjectionMatrix();
  const wc = $('warp'); wc.width = w; wc.height = h;
}
addEventListener('resize', resize); resize();

const MOON_DIR = new V3(0.22, 0.4, -1).normalize();
scene.add(new THREE.HemisphereLight(0x8a78ff, 0x140e36, 0.95));
scene.add(new THREE.AmbientLight(0x3a2a80, 0.45));
const moonLight = new THREE.DirectionalLight(0xb8c0ff, 1.3);
moonLight.position.copy(MOON_DIR).multiplyScalar(100); scene.add(moonLight);

/* ---------- helpers ---------- */
const phong = (c, o = {}) => new THREE.MeshPhongMaterial(Object.assign({ color: c, flatShading: true, shininess: 6 }, o));
const basic = (c, o = {}) => new THREE.MeshBasicMaterial(Object.assign({ color: c }, o));
const rockMat = new THREE.MeshPhongMaterial({ vertexColors: true, flatShading: true, shininess: 4 });
function rockify(geo, amt, freq = 0.6, off = 0) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    p.setXYZ(i,
      x + (vnoise(x * freq + off, y * freq + z * 0.7) - 0.5) * amt,
      y + (vnoise(y * freq + 5 + off, z * freq + x * 0.3) - 0.5) * amt,
      z + (vnoise(z * freq + 11, x * freq * 0.8 + y * freq + off) - 0.5) * amt);
  }
  geo.computeVertexNormals();
  return geo;
}
function colorize(geo, c1, c2, freq = 0.4, off = 0) {
  const p = geo.attributes.position, a = new Float32Array(p.count * 3);
  const A = new THREE.Color(c1), B = new THREE.Color(c2), t = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const n = vnoise(p.getX(i) * freq + p.getY(i) * 0.3 + off, p.getZ(i) * freq - p.getY(i) * freq * 0.5);
    t.copy(A).lerp(B, n); a.set([t.r, t.g, t.b], i * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(a, 3));
  return geo;
}
const rock = (geo, amt, freq, c1 = 0x3d3768, c2 = 0x5b5290, off = 0) => colorize(rockify(geo, amt, freq, off), c1, c2, 0.35, off);
function part(geo, color, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  g.applyMatrix4(new THREE.Matrix4().compose(new V3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), new V3(sx, sy, sz)));
  if (color !== null) {
    const n = g.attributes.position.count, c = new THREE.Color(color), a = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) a.set([c.r, c.g, c.b], i * 3);
    g.setAttribute('color', new THREE.BufferAttribute(a, 3));
  }
  return g;
}
function merge(list) {
  let n = 0; list.forEach(g => n += g.attributes.position.count);
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), col = new Float32Array(n * 3);
  let o = 0;
  for (const g of list) {
    pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3); col.set(g.attributes.color.array, o * 3);
    o += g.attributes.position.count;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return out;
}
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;

const glowTex = canvasTex(128, 128, (x, w) => {
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.18, 'rgba(255,255,255,.6)');
  g.addColorStop(0.45, 'rgba(255,255,255,.16)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, w, w);
});
function glow(color, size, opacity = 1, fog = true) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity, fog }));
  s.scale.set(size, size, 1);
  return s;
}
function starTex(bg, fg) {
  return canvasTex(128, 128, (x) => {

const D = { open: false, queue: [], cur: null, shown: 0, full: false, onDone: null, openedAt: 0 };
function say(lines, onDone) {
  D.queue = lines.slice(); D.onDone = onDone || null; D.open = true; D.openedAt = performance.now();
  $('dialog').hidden = false; $('prompt').hidden = true; $('touch').hidden = true;
  $('toast').classList.remove('on'); toastT = 0;
  nextLine();
}
function nextLine() {
  if (D.cur && D.cur.after) { const a = D.cur.after; D.cur.after = null; a(); }
  if (!D.queue.length) return closeDialog();
  D.cur = Object.assign({}, D.queue.shift()); D.shown = 0; D.full = false;
  $('dwho').textContent = D.cur.who; $('dtext').textContent = ''; $('dchoices').innerHTML = ''; $('dnext').hidden = true;
  sfx.blip();
}
function finishLine() {
  D.full = true; D.shown = D.cur.text.length; $('dtext').textContent = D.cur.text;
  if (D.cur.choices) {
    const box = $('dchoices');
    D.cur.choices.forEach((c, i) => {
      const b = document.createElement('button'); b.textContent = c;
      b.addEventListener('click', e => { e.stopPropagation(); D.queue = D.cur.pick(i); D.cur = null; nextLine(); });
      box.appendChild(b);
    });
  } else $('dnext').hidden = false;
}
function advance() {
  if (!D.open || performance.now() - D.openedAt < 200) return;
  if (!D.full) return finishLine();
  if (D.cur.choices) return;
  nextLine();
}
function closeDialog() {
  D.open = false; D.cur = null; $('dialog').hidden = true;

  hub.bubbles.forEach(b => { const u = b.userData, k = (t * 0.45 + u.o) % 1; b.position.set(u.x * (1 - k * 0.5), 2.5 + k * 4, u.z * (1 - k * 0.5)); b.material.opacity = (1 - k) * 0.8; });
  hub.wizBody.rotation.z = Math.sin(t * 0.9) * 0.03;
  hub.spoon.rotation.z = 0.15 + Math.sin(t * 1.6) * 0.25; hub.spoon.rotation.x = 0.5 + Math.cos(t * 1.6) * 0.15;
  if (hub.beam) hub.beam.material.opacity = 0.18 + Math.sin(t * 1.5) * 0.05;
  // path glow
  if (S.pathGlow) pathMat.emissive.setRGB(0.12 * S.pathGlow, 0.2 * S.pathGlow, 0.65 * S.pathGlow * (0.85 + Math.sin(t * 2) * 0.15));
  // toad
  toad.throat.scale.setScalar(1 + Math.max(0, Math.sin(t * 2.2)) * 0.35);
  if (toad.spit) { toad.spit -= dt; toad.body.scale.y = 1 + Math.sin(toad.spit * 20) * 0.08 * toad.spit; }
  // lake stones + dragon
  lake.stones.forEach(s => { s.p.y = WATER_Y + 0.35 + Math.sin(t * 1.15 + s.ph) * 0.85; s.m.position.set(s.p.x, s.p.y - 2, s.p.z); });
  lake.dragon.position.y = WATER_Y + Math.sin(t * 0.6) * 0.4;
  lake.head.rotation.y = Math.sin(t * 0.35) * 0.25; lake.head.rotation.x = Math.sin(t * 0.5) * 0.05;
  // mushrooms squash
  PLATS.forEach(p => { if (p.squash) { p.squash = Math.max(0, p.squash - dt * 3); p.cap.scale.y = 0.3 * (1 - Math.sin(p.squash * Math.PI) * 0.35); } });
  // tower flicker
  turm.light.intensity = 2.2 + Math.sin(t * 0.8) * 0.4;
  turm['torch-1'].material.opacity = 0.8 + Math.sin(t * 11) * 0.15; turm['torch1'].material.opacity = 0.8 + Math.sin(t * 9 + 1) * 0.15;
  if (S.gateOpen) turm.portal.material.opacity = 0.45 + Math.sin(t * 2.5) * 0.12;
  // lanterns flicker
  grove.lanterns.forEach((L, i) => { if (grove.lit[i]) L.lg.material.opacity = 0.8 + Math.sin(t * 10 + i * 3) * 0.15; });
  // moon brightens with shards
  const n = shardCount();
  if (S.mode !== 'end') moonHalo.material.opacity = 0.45 + n * 0.08 + Math.sin(t * 0.7) * 0.04;
  // shards
  for (const id in SHARDS) {
    const s = SHARDS[id];
    if (!s.available || s.taken) continue;
    s.g.position.y = s.base + Math.sin(t * 2 + s.base) * 0.25; s.core.rotation.y = t * 1.5;
    if (S.mode === 'play' && !D.open) {
      const dx = P.pos.x - s.g.position.x, dz = P.pos.z - s.g.position.z, dy = s.g.position.y - (P.pos.y + 1);
      if (dx * dx + dz * dz < 2.2 && Math.abs(dy) < 2.3) {

        const left = 5 - shardCount();

}
function updateEye(dt) {
  const inZone = S.mode === 'play' && !D.open && P.pos.distanceTo(tmpO.position.set(eye.pos.x, P.pos.y, eye.pos.z)) < 20;
  const hunting = inZone && !SHARDS.auge.taken;
  eye.t -= dt;
  if (eye.t <= 0) {
    if (eye.state === 'closed') { eye.state = hunting ? 'warn' : 'open'; eye.t = hunting ? 0.9 : rr(2, 4); if (hunting) sfx.warn(); }
    else if (eye.state === 'warn') { eye.state = 'open'; eye.t = rr(1.8, 3.2); eye.grace = 0.2; }
    else if (eye.state === 'open') { eye.state = 'closed'; eye.t = hunting ? rr(1.6, 2.8) : 0.25; }
  }
  const want = eye.state === 'open' ? 1 : eye.state === 'warn' ? 0.28 : 0;
  eye.open = lerp(eye.open, want, 1 - Math.exp(-(eye.state === 'closed' ? 18 : 9) * dt));
  eye.upper.rotation.x = -1.25 * eye.open; eye.lower.rotation.x = 1.0 * eye.open;
  const danger = hunting && (eye.state === 'open' || eye.state === 'warn');
  eye.tint.set(danger ? (eye.state === 'open' ? 0xff3344 : 0xffc040) : 0x52ff8c);
  eye.irisMat.color.lerp(eye.tint, 1 - Math.exp(-8 * dt)); eye.glow.material.color.copy(eye.irisMat.color);
  // track player
  tmpO.position.copy(eye.group.getWorldPosition(new V3()));
  tmpO.lookAt(P.pos.x, P.pos.y + 1, P.pos.z);
  const parentQ = eye.group.parent.getWorldQuaternion(new THREE.Quaternion()).invert();
  tmpQ.copy(parentQ).multiply(tmpO.quaternion);
  eye.group.quaternion.slerp(tmpQ, 1 - Math.exp(-3 * dt));
  if (eye.grace) eye.grace = Math.max(0, eye.grace - dt);
  if (hunting && eye.state === 'open' && !eye.grace && eye.open > 0.6 && Math.hypot(P.vel.x, P.vel.z) > 1.3) {
    sfx.caught(); respawn(eye.spawn, 'Das Auge hat dich gesehen! Beweg dich nur, wenn es geschlossen ist.');
    eye.state = 'closed'; eye.t = 2.2;
  }
}
function updateZones() {
  let z = '';
  for (const Z of ZONES) if (Math.hypot(P.pos.x - Z.x, P.pos.z - Z.z) < Z.r) { z = Z.n; if (!S.seenZones[Z.n]) { S.seenZones[Z.n] = 1; if (Z.hint) setTimeout(() => toast(Z.hint, 5), 1600); } break; }
  if (z && z !== S.zone) showZone(z);
  S.zone = z;
}
function updatePrompt() {
  let best = null, bd = 1e9;
  if (S.mode === 'play' && !D.open) for (const it of INTER) {
    const d = Math.hypot(P.pos.x - it.x, P.pos.z - it.z);
    if (d < it.r && d < bd) { const l = it.label(); if (l) { best = it; bd = d; best._l = l; } }
  }
  const el = $('prompt');
  if (best !== curInter || (best && el.dataset.l !== best._l)) {
    curInter = best;
    if (best) { el.innerHTML = (TOUCH ? '' : '<kbd>E</kbd>') + best._l; el.dataset.l = best._l; el.hidden = false; }
    else el.hidden = true;
  }
}

/* ---------- game flow ---------- */
function startGame() {
  if (S.mode !== 'title') return;
  initAudio();
  S.mode = 'play'; $('title').hidden = true; $('hud').hidden = false;
  if (TOUCH) $('touch').hidden = false;
  camera.position.set(P.pos.x, P.pos.y + 6, P.pos.z + 10);
  lookAt.set(P.pos.x, P.pos.y + 1.7, P.pos.z);
  updateGoal();
  setTimeout(() => { if (!S.talked) toast('Geh zum Zauberer am leuchtenden Kessel.', 4); }, 1200);
}
$('startBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', () => location.reload());

/* ---------- loop ---------- */
const clock = new THREE.Clock();
let t = 0, perfAcc = 0, perfN = 0, mapTick = 0;
function frame() {
  requestAnimationFrame(frame);
  const raw = clock.getDelta(), dt = Math.min(raw, 0.05); t += dt;
  if (S.mode === 'play') S.time += dt;
  scheduleMusic();
  if (S.mode === 'play' || S.mode === 'cut') updatePlayer(dt);
  updateCut(dt);
  updateWorld(dt, t);
  if (S.mode === 'play') { updateZones(); updatePrompt(); }
  else if (!$('prompt').hidden) { $('prompt').hidden = true; curInter = null; }
  if (D.open && !D.full) {
    D.shown += dt * 48; const n = Math.floor(D.shown);
    $('dtext').textContent = D.cur.text.slice(0, n);
    if (n >= D.cur.text.length) finishLine();
  }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('on'); }
  if (zoneT > 0) { zoneT -= dt; if (zoneT <= 0) $('zone').classList.remove('on'); }
  updateCamera(dt, t);
  drawWarp(dt);
  if (S.mode === 'play' && ++mapTick % 3 === 0) drawMap();
  renderer.render(scene, camera);
  // adaptive resolution
  perfAcc += raw; perfN++;
  if (perfN >= 90) {
    const avg = perfAcc / perfN;
    if (avg > 1 / 38 && quality > 0.45) { quality -= 0.1; setPR(); resize(); }
    else if (avg < 1 / 58 && quality < 0.72) { quality = Math.min(0.72, quality + 0.05); setPR(); resize(); }
    perfAcc = 0; perfN = 0;
  }
}

/* ---------- hot reload + boot ---------- */
function snapshot() {
  return {
    v: 1, mode: S.mode === 'cut' ? 'play' : S.mode, talked: S.talked, riddle: S.riddle, brewed: S.brewed, gateOpen: S.gateOpen, time: S.time,
    shards: Object.fromEntries(Object.entries(SHARDS).map(([k, s]) => [k, s.taken])), lit: grove.lit.slice(),
    pos: [P.pos.x, P.pos.y, P.pos.z], face: P.face, camYaw, muted
  };
}
function start(data) {
  const d = data && data.save;
  if (d && d.v === 1 && d.mode !== 'title') {
    Object.assign(S, { talked: d.talked, riddle: d.riddle, brewed: d.brewed, gateOpen: d.gateOpen, time: d.time || 0 });
    if (d.riddle) spitShard(true);
    (d.lit || []).forEach((l, i) => { if (l) { grove.lit[i] = true; applyLantern(i); } });
    if (grove.lit.every(Boolean)) wakeSkull(true);
    for (const k in d.shards) if (d.shards[k] && SHARDS[k]) { SHARDS[k].taken = true; SHARDS[k].g.visible = false; }
    if (d.gateOpen) applyGateOpen();
    P.pos.set(d.pos[0], d.pos[1], d.pos[2]); P.face = d.face; camYaw = d.camYaw || 0;

try { window.claude?.hot?.snapshot?.(() => ({ save: snapshot() })); } catch (_) {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
window.__dunkelmond = { S, P, SHARDS, grove, eye, startGame, say, interact, terrainH, aim: (x, z) => { camYaw = Math.atan2(-(x - P.pos.x), -(z - P.pos.z)); } };
})();
</script>
